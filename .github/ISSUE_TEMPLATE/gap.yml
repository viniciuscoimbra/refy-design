name: Missing in refy
description: A component does not do what your screen needs, or a whole family is missing.
labels: ["gap"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, answer the three questions at https://refy.design/en/contributing#antes. If the theme solves it, or the piece is a composition of your product, the change stays in your project. You can write in English, Portuguese or Spanish.
  - type: input
    id: component
    attributes:
      label: Component
      description: Existing family that falls short, or the proposed name for the new one.
      placeholder: Segmented
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is missing
      options:
        - Prop or token in an existing component
        - New family
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: The screen that needs it
      description: What the person does on this screen and what the component does not allow. An image helps.
    validations:
      required: true
  - type: textarea
    id: theme
    attributes:
      label: Why the theme does not solve it
      description: For an existing component, the line of the component that blocks it (for example, a value without a token, a layout without a prop).
  - type: textarea
    id: layer
    attributes:
      label: Layer and purpose
      description: For a new family. Atom, molecule or organism; actions, forms, navigation, feedback, data, content or structure; and which components it reuses.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I will send the pull request generated by `npx -p @refy-design/web refy contribute`.
