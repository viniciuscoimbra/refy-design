name: Release
# Depois que o CI passa numa versão do repositório público, anexa o pacote ao release (o README
# instala por esse link) e publica no npm pelo Trusted Publishing: o npm confia neste workflow do
# refy-design por OIDC, sem token e sem aprovação manual.
# A versão chega de dois jeitos: tag vX.Y.Z empurrada junto com o main, ou só o commit
# `refy X.Y.Z` no main. No segundo caso este workflow cria a tag no próprio commit.
on:
  workflow_run:
    workflows: ["Validar biblioteca"]
    types: [completed]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    if: >-
      github.repository == 'viniciuscoimbra/refy-design' &&
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'v') || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Versão
        run: |
          anotar() {
            OBJ=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$1" -f message="refy ${1#v}" -f object="$2" -f type=commit \
              -f 'tagger[name]=Vinícius Coimbra' -f 'tagger[email]=966864+viniciuscoimbra@users.noreply.github.com' \
              -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --jq .sha)
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$1" -f sha="$OBJ" -F force=true
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$1" -f sha="$OBJ"
            fi
          }
          # Versão anterior que ficou com tag leve (a 1.3.1) ou sem tag (a 1.3.2) ganha a tag anotada
          # no commit "refy X.Y.Z" dela, para o histórico conferir.
          git fetch -q --tags origin main
          git log --first-parent --format='%H %s' origin/main | while read -r SHA SUBJ; do
            V="${SUBJ#refy }"; [ "$SUBJ" != "$V" ] || continue
            printf %s "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || continue
            [ "$HEAD_BRANCH" = main ] && [ "$SHA" = "$HEAD_SHA" ] && continue
            TIPO=$(git cat-file -t "refs/tags/v$V" 2>/dev/null || true)
            if [ "$TIPO" != tag ] && { [ -z "$TIPO" ] || [ "$(git rev-parse "refs/tags/v$V")" = "$SHA" ]; }; then
              echo "v$V: tag anotada no commit ${SHA:0:7}"; anotar "v$V" "$SHA" >/dev/null
            fi
          done
          if [ "$HEAD_BRANCH" != main ]; then echo "TAG=$HEAD_BRANCH" >> "$GITHUB_ENV"; exit 0; fi
          MSG=$(git log -1 --format=%s "$HEAD_SHA")
          VERSION="${MSG#refy }"
          if [ "$MSG" = "$VERSION" ] || ! printf %s "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Commit do main sem versão ($MSG): nada a publicar."; echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
          if npm view "@refy-design/web@$VERSION" version >/dev/null 2>&1; then
            echo "@refy-design/web@$VERSION já está no npm."; echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
          # A tag é anotada pelo mantenedor, como o autoria.yml cobra. O ls-remote devolve o commit
          # da tag anotada na linha ^{}; o gh api, num 404, escreve o corpo do erro na saída.
          TAG_SHA=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -1 | cut -f1)
          if [ -z "$TAG_SHA" ]; then
            anotar "v$VERSION" "$HEAD_SHA" >/dev/null
          elif [ "$TAG_SHA" != "$HEAD_SHA" ] && ! gh release view "v$VERSION" >/dev/null 2>&1; then
            # Tag anotada empurrada junto com o main: o run de CI da própria tag publica.
            echo "v$VERSION veio empurrada: o run da tag publica."; echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
          # Tag já criada por um run anterior que caiu antes do npm: este run termina o trabalho.
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.1.0
        if: env.PULAR != '1'
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - if: env.PULAR != '1'
        run: npm ci --no-audit --no-fund
      - name: Pacote
        if: env.PULAR != '1'
        run: |
          VERSION="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          npm pack
          # O pacote mobile sai do mesmo commit, com a versão do próprio package.json.
          (cd packages/native && npm ci --no-audit --no-fund && npm pack --pack-destination ../..)
          # Extensão de um clique do Claude Desktop; o npm pack acima já montou dist/.
          node scripts/build-mcpb.mjs
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notas.md
          test -s notas.md
      - name: Release no GitHub
        if: env.PULAR != '1'
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "refy-design-web-$VERSION.tgz" refy-design-mobile-*.tgz release/refy.mcpb --clobber
          else
            gh release create "$TAG" "refy-design-web-$VERSION.tgz" refy-design-mobile-*.tgz release/refy.mcpb --verify-tag --title "refy $VERSION" --notes-file notas.md
          fi
      - name: npm
        if: env.PULAR != '1'
        run: |
          VERSION="${TAG#v}"
          if npm view "@refy-design/web@$VERSION" version >/dev/null 2>&1; then echo "@refy-design/web@$VERSION já está no npm."; exit 0; fi
          # Trusted Publishing exige npm 11.5.1 ou mais novo; o Node 22 traz o 10.
          npx -y npm@11.6.2 publish "refy-design-web-$VERSION.tgz" --access public --provenance --loglevel verbose
