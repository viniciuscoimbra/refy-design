name: Autoria das versões
# O repositório público só recebe versões promovidas: um commit por versão, do
# mantenedor, com a mensagem "refy X.Y.Z". Pull requests entram na versão seguinte.
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  autoria:
    if: github.repository == 'viniciuscoimbra/refy-design'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-release-history.mjs
